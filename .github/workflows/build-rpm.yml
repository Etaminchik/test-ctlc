name: Build test-ctlc RPM & Release

# test-ctlc — VAS Experts OIMC/СОРМ traffic binding-quality auditor.
# The short git commit is embedded into both the source archive name and the
# RPM Release, so every build is traceable to a commit.
#
# Триггеры:
#   push в любую ветку  → сборка + артефакт (имя содержит git-коммит)
#   push тега v*.*.*    → сборка + GitHub Release
#   workflow_dispatch   → ручной запуск на любой ветке (без Release)
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-rpm:
    name: Build RPM (AlmaLinux 8 / CentOS 8 compatible)
    runs-on: ubuntu-latest
    container:
      image: almalinux:8
    permissions:
      contents: write

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y git rpm-build rpmdevtools python3 python3-pip python3-devel gcc tar gzip

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build RPM
        id: rpm
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          GIT_COMMIT=$(git rev-parse --short HEAD)
          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' lib/version.py)
          echo "Building test-ctlc ${VERSION} (commit ${GIT_COMMIT})"
          rpmdev-setuptree
          tar --transform "s,^,test-ctlc-${VERSION}-${GIT_COMMIT}/," \
              -czf "$HOME/rpmbuild/SOURCES/test-ctlc-${VERSION}-${GIT_COMMIT}.tar.gz" \
              test-ctlc.py lib tools config.conf.defaults packaging CLAUDE.md
          rpmbuild -bb \
            --define "_topdir $HOME/rpmbuild" \
            --define "git_commit ${GIT_COMMIT}" \
            packaging/test-ctlc.spec
          path=$(find "$HOME/rpmbuild/RPMS" -name "test-ctlc-*.rpm" | head -1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"
          echo "Built: $(basename "$path")"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rpm.outputs.name }}
          path: ${{ steps.rpm.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: test-ctlc ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.rpm.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
