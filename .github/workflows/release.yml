name: release

# When a pull request is merged into master, build the RPM, create a git tag
# from the tool version (lib/version.py) and publish a GitHub Release with the
# RPM attached.
on:
  pull_request:
    branches: [master]
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream8
    steps:
      - name: Enable vault repos (CentOS Stream 8 is EOL) and install build deps
        run: |
          sed -i -e 's|^mirrorlist=|#mirrorlist=|' \
                 -e 's|^#\?baseurl=http://mirror.centos.org|baseurl=https://vault.centos.org|' \
                 /etc/yum.repos.d/CentOS-*.repo
          dnf -y install rpm-build rpmdevtools python3 python3-devel gcc git tar gzip

      - name: Checkout merged master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Build RPM
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' lib/version.py)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          rpmdev-setuptree
          tar --transform "s,^,test-ctlc-${VERSION}/," \
              -czf "$HOME/rpmbuild/SOURCES/test-ctlc-${VERSION}.tar.gz" \
              test-ctlc.py lib tools config.conf.defaults packaging CLAUDE.md
          rpmbuild -bb --define "_topdir $HOME/rpmbuild" packaging/test-ctlc.spec
          mkdir -p artifacts
          cp "$HOME"/rpmbuild/RPMS/*/*.rpm artifacts/
          ls -l artifacts/

      - name: Create tag and GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.event.pull_request.base.ref }}
          generate_release_notes: true
          files: artifacts/*.rpm
